<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mayur Bagade animated voxel header</title>
  <desc id="desc">A neon voxel landscape with small builders moving blocks through a futuristic full-stack city.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#092b34"/>
      <stop offset="1" stop-color="#122015"/>
    </linearGradient>
    <linearGradient id="neon" x1="160" y1="0" x2="1040" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4FF"/>
      <stop offset="0.52" stop-color="#00FFA3"/>
      <stop offset="1" stop-color="#FFE66D"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#FFFFFF" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#sky)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)" opacity="0.8"/>
  <path d="M0 336C132 292 238 356 366 312C480 273 564 224 701 258C827 290 926 343 1200 274V420H0V336Z" fill="#07161c"/>
  <path d="M0 337C132 292 238 356 366 312C480 273 564 224 701 258C827 290 926 343 1200 274" stroke="url(#neon)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="40 18;10 28;40 18" dur="6s" repeatCount="indefinite"/>
  </path>

  <g opacity="0.9">
    <circle cx="122" cy="82" r="2" fill="#E6F7FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="248" cy="54" r="2" fill="#E6F7FF"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="904" cy="72" r="2" fill="#E6F7FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1056" cy="118" r="2" fill="#E6F7FF"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <g filter="url(#glow)">
    <circle cx="982" cy="92" r="38" fill="#FFE66D" opacity="0.95">
      <animate attributeName="r" values="35;42;35" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="982" cy="92" r="58" stroke="#FFE66D" stroke-opacity="0.28" stroke-width="3">
      <animate attributeName="r" values="48;72;48" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.08;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.9">
    <g>
      <rect x="82" y="118" width="104" height="28" rx="14" fill="#CFF8FF" opacity="0.16"/>
      <rect x="134" y="103" width="112" height="28" rx="14" fill="#CFF8FF" opacity="0.12"/>
      <animateTransform attributeName="transform" type="translate" values="-40 0;48 0;-40 0" dur="18s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="762" y="142" width="126" height="28" rx="14" fill="#CFF8FF" opacity="0.13"/>
      <rect x="838" y="124" width="94" height="28" rx="14" fill="#CFF8FF" opacity="0.17"/>
      <animateTransform attributeName="transform" type="translate" values="60 0;-50 0;60 0" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(84 250)">
    <rect x="0" y="48" width="86" height="44" fill="#143743" stroke="#00D4FF"/>
    <rect x="86" y="22" width="86" height="70" fill="#112a34" stroke="#00FFA3"/>
    <rect x="172" y="-8" width="86" height="100" fill="#10252f" stroke="#FFE66D"/>
    <rect x="258" y="34" width="86" height="58" fill="#143743" stroke="#00D4FF"/>
    <animateTransform attributeName="transform" type="translate" values="84 250;84 242;84 250" dur="4.8s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(738 244)">
    <rect x="0" y="52" width="72" height="48" fill="#142f2a" stroke="#00FFA3"/>
    <rect x="72" y="12" width="72" height="88" fill="#132935" stroke="#00D4FF"/>
    <rect x="144" y="-28" width="72" height="128" fill="#1d2a21" stroke="#FFE66D"/>
    <rect x="216" y="32" width="72" height="68" fill="#142f2a" stroke="#00FFA3"/>
    <animateTransform attributeName="transform" type="translate" values="738 244;738 236;738 244" dur="5.4s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(0 0)">
    <g transform="translate(120 324)">
      <rect x="0" y="18" width="32" height="26" rx="3" fill="#FFE66D"/>
      <rect x="7" y="0" width="18" height="18" rx="4" fill="#00D4FF"/>
      <rect x="8" y="44" width="7" height="22" fill="#E6EDF3"/>
      <rect x="20" y="44" width="7" height="22" fill="#E6EDF3"/>
      <rect x="42" y="30" width="28" height="22" fill="#00FFA3" opacity="0.9"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="-90 0;420 0;-90 0" dur="11s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(0 0)">
    <g transform="translate(840 318)">
      <rect x="0" y="18" width="30" height="28" rx="3" fill="#00FFA3"/>
      <rect x="6" y="0" width="18" height="18" rx="4" fill="#FFE66D"/>
      <rect x="7" y="46" width="7" height="21" fill="#E6EDF3"/>
      <rect x="19" y="46" width="7" height="21" fill="#E6EDF3"/>
      <rect x="-42" y="32" width="28" height="20" fill="#00D4FF" opacity="0.9"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="140 0;-460 0;140 0" dur="13s" repeatCount="indefinite"/>
  </g>

  <g text-anchor="middle">
    <text x="600" y="154" fill="#FFFFFF" font-family="Verdana, Arial, sans-serif" font-size="64" font-weight="800">Mayur Bagade</text>
    <text x="600" y="196" fill="url(#neon)" font-family="Verdana, Arial, sans-serif" font-size="27" font-weight="700">Full-Stack Developer | AI Builder | SaaS Engineer</text>
    <text x="600" y="232" fill="#B8CAD2" font-family="Verdana, Arial, sans-serif" font-size="18">shipping intelligent products across frontend, backend, cloud, and automation</text>
  </g>
</svg>